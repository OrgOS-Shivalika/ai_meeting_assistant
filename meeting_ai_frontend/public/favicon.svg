<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- The AuthShell brand glyph, as a favicon.
       Mirrors <span class="size-8 rounded-[9px] bg-pink"> wrapping
       <span class="size-[13px] rounded-[4px] bg-peach">:
         32px box, 9px radius, --color-pink  #ff4d8b
         13px dot, 4px radius, --color-peach #ffb084, centred at (32-13)/2.
       Values are literal because a favicon is served standalone — it never
       sees the stylesheet those tokens live in. If the tokens change in
       src/index.css, change them here too. -->
  <rect width="32" height="32" rx="9" fill="#ff4d8b"/>
  <rect x="9.5" y="9.5" width="13" height="13" rx="4" fill="#ffb084"/>
</svg>
