<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= is a cache-buster. Browsers cache favicons far more stubbornly
         than other assets and ignore a normal hard-reload, so changing the
         graphic without changing the URL leaves the old icon in the tab.
         Bump this whenever favicon.png changes.

         Only ONE icon is declared on purpose: with both a PNG and an SVG
         listed, Chrome prefers the SVG, so leaving the old line in would have
         made this change look like it did nothing. favicon.svg is still on
         disk, just not referenced. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Hanken Grotesk (display + UI) and JetBrains Mono (data) are the
         design system's faces. Linked here as well as @imported from
         index.css so the first paint isn't in a fallback. -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>OrgOS Meeting Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
