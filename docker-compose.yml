# Phase 1B development stack.
#
# Services:
#   postgres   PostgreSQL 16 with pgvector pre-installed (port 5433 on host
#              to avoid colliding with any existing host-Postgres on 5432).
#   redis      Celery broker + result backend.
#   minio      S3-compatible object storage for document uploads.
#   minio-init Idempotent bucket bootstrap (runs once, exits).
#   worker     Celery worker. Consumes meeting tasks from Redis.
#
# The FastAPI app is intentionally NOT in compose during Phase 1B — running it
# on the host preserves the fast iterate loop. Set USE_CELERY=true in .env to
# route /inject-bot through the worker.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meeting-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_ai}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meeting-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: meeting-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: meeting-ai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-meeting-ai-documents};
      mc anonymous set download local/${S3_BUCKET:-meeting-ai-documents} || true;
      echo 'MinIO bucket bootstrapped';
      "

  # Self-hosted Langfuse (LLM tracing). Replaces cloud.langfuse.com so
  # prompts + completions never leave this host.
  #
  # Pinned to the `2` major tag deliberately: the Python SDK is pinned to
  # `langfuse>=2.60,<3` in requirements.txt, and a v2 server needs ONLY
  # Postgres. The v3 server additionally requires ClickHouse + Redis +
  # blob storage — real infra for no benefit until the SDK pin moves.
  langfuse:
    image: langfuse/langfuse:2
    container_name: meeting-ai-langfuse
    ports:
      - "3000:3000"
    environment:
      # Its own DATABASE, on the Postgres server we already run. Langfuse
      # manages this schema with its own migrations — keeping it out of
      # `meeting_ai` means it can never collide with alembic.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      # Must match the URL you open in the browser, or login redirects break.
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      # 32-byte hex. Encrypts stored integration credentials at rest.
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      # Same data-residency stance as MEM0_TELEMETRY=false.
      TELEMETRY_ENABLED: "false"
      # Nothing here should phone home for release checks either.
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Headless init — creates the org, project, login user AND pins the
      # API keys on first boot, so there is no "open the UI and paste keys
      # back into .env" step and a rebuilt volume comes back identical.
      # Ignored once those rows exist, so it is safe to leave in place.
      LANGFUSE_INIT_ORG_ID: smoothops
      LANGFUSE_INIT_ORG_NAME: SmoothOps
      LANGFUSE_INIT_PROJECT_ID: agentic-meeting-assistant
      LANGFUSE_INIT_PROJECT_NAME: Agentic Meeting Assistant
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: create the `langfuse` database if it isn't there.
  #
  # This exists because a `/docker-entrypoint-initdb.d` script only runs
  # against a FRESH volume, and postgres_data is already initialized —
  # so the usual trick would silently do nothing here. Same idempotent
  # one-shot pattern as minio-init above. Reuses the pgvector image so
  # there's no extra pull.
  langfuse-db-init:
    image: pgvector/pgvector:pg16
    container_name: meeting-ai-langfuse-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # Idempotent via `|| true`, not a SELECT-then-branch: a folded YAML
    # scalar mangles pipes and escaped quotes (the first version died on
    # `/bin/sh: Syntax error: "|" unexpected`). Re-running just re-raises
    # "database already exists", which is the same swallow-the-error trick
    # minio-init uses above.
    entrypoint: >
      /bin/sh -c "psql -h postgres -U ${POSTGRES_USER:-postgres} -d postgres -c 'CREATE DATABASE langfuse' || true; echo 'langfuse database ready'"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meeting-ai-worker
    command: celery -A app.celery_app.celery worker --loglevel=info --pool=prefork --concurrency=2
    env_file:
      - .env
    environment:
      # Override service-discovery values for inside-Docker.
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/meeting_ai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      USE_CELERY: "true"
      # The worker is INSIDE the compose network, so localhost is itself.
      # settings.py reads LANGFUSE_HOST before falling back to
      # LANGFUSE_BASE_URL, so setting this here beats the .env value the
      # host-run FastAPI process uses — no second variable needed.
      LANGFUSE_HOST: http://langfuse:3000
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
